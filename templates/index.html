<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Sentry</title>
  <style>
    :root { color-scheme: light; --ink: #1a1a1a; --muted: #5c5c5c; --line: #d9d9d4; --bg: #fafaf5; --accent: #3553ff; }
    body { margin: 0; font: 16px/1.45 "Source Serif 4", Georgia, serif; background: var(--bg); color: var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font: 700 28px/1.2 ui-sans-serif, system-ui; letter-spacing: -0.03em; }
    p.lede { color: var(--muted); }
    textarea { width: 100%; min-height: 90px; padding: 12px; font: 14px/1.4 ui-monospace, monospace; border: 1px solid var(--line); background: #fff; }
    button { margin-top: 8px; padding: 8px 14px; border: 0; background: var(--accent); color: #fff; font: 600 14px ui-sans-serif, system-ui; cursor: pointer; }
    pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); padding: 12px; font: 12px/1.45 ui-monospace, monospace; }
    .pills span { display: inline-block; margin: 0 8px 8px 0; padding: 2px 8px; border: 1px solid var(--line); font: 12px ui-sans-serif, system-ui; }
  </style>
</head>
<body>
  <main>
    <h1>Ops Sentry</h1>
    <p class="lede">Internal ops agent for Helio Devices. Grounded on SOPs, typed tools, injection defenses. Try <code>CAM-014 has night IR flicker</code> or <code>Unlock all doors</code>.</p>
    <form id="f">
      <textarea id="q" name="query">CAM-014 has night IR flicker. What priority?</textarea>
      <button type="submit">Ask</button>
    </form>
    <p class="pills" id="meta"></p>
    <pre id="out">Ready.</pre>
  </main>
  <script>
    const f = document.getElementById("f");
    const q = document.getElementById("q");
    const out = document.getElementById("out");
    const meta = document.getElementById("meta");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      out.textContent = "Running agent…";
      const res = await fetch("/v1/ask", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ query: q.value, operator: "demo" })
      });
      const data = await res.json();
      meta.innerHTML = ["blocked " + data.blocked, data.risk, data.latency_ms + " ms", data.provider]
        .map((x) => "<span>" + x + "</span>").join("");
      out.textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
